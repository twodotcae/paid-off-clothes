# Staging. Same image, separate app, SEPARATE VOLUME — so a test order or a bad catalogue edit
# here can never touch the real shop's database.
#
# Deploy with:  fly deploy --config fly.staging.toml

app = "paid-off-clothes-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  POC_DATA_DIR = "/data"
  PORT = "8080"
  POC_ENV = "staging"

[http_service]
  internal_port = 8080
  force_https = true
  # Staging stays warm: min_machines_running=1 keeps one machine running at all times, so a
  # reviewer's first request of the day never eats a cold start. auto_stop_machines is left at
  # "stop" — Fly just never scales below the floor set by min_machines_running, so the two settings
  # don't fight. It's a shared-cpu-1x machine, so staying up around the clock still costs pennies.
  # The reservation sweep runs on the order path regardless.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "poc_data_staging"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

