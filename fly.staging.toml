# Staging. Same image, separate app, SEPARATE VOLUME — so a test order or a bad catalogue edit
# here can never touch the real shop's database.
#
# Deploy with:  fly deploy --config fly.staging.toml

app = "paid-off-clothes-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  POC_DATA_DIR = "/data"
  PORT = "8080"
  POC_ENV = "staging"

[http_service]
  internal_port = 8080
  force_https = true
  # Staging sleeps when idle and wakes on the next request. It costs pennies and nobody is waiting
  # on it. The reservation sweep still runs on the order path when it wakes.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "poc_data_staging"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
